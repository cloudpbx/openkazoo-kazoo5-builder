name: verify-install

on:
  workflow_run:
    workflows: [build-and-publish]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'   # Mondays at 04:17 UTC

permissions:
  contents: read

jobs:
  install-debian:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    name: install-debian (${{ matrix.suite }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: bookworm, image: 'debian:12-slim', arch: amd64, runs_on: ubuntu-latest }
          - { suite: bookworm, image: 'debian:12-slim', arch: arm64, runs_on: ubuntu-24.04-arm }
          - { suite: bullseye, image: 'debian:11-slim', arch: amd64, runs_on: ubuntu-latest }
          - { suite: bullseye, image: 'debian:11-slim', arch: arm64, runs_on: ubuntu-24.04-arm }
    steps:
      - name: Install from published apt repo
        run: |
          docker run --rm ${{ matrix.image }} bash -e -c '
            set -euxo pipefail
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates curl gnupg

            # No ESL repo needed: ERTS is bundled inside the kazoo package
            # (relx tar-release ships the OTP runtime in /opt/kazoo/erts-*).

            # openkazoo repo. --retry-all-errors waits out 404s when
            # GitHub Pages is still propagating after a fresh publish.
            curl -fsSL --retry 12 --retry-delay 10 --retry-all-errors \
              https://cloudpbx.github.io/openkazoo-kazoo5-builder/pubkey.asc \
              -o /usr/share/keyrings/openkazoo.asc
            echo "deb [signed-by=/usr/share/keyrings/openkazoo.asc] \
              https://cloudpbx.github.io/openkazoo-kazoo5-builder/debian ${{ matrix.suite }} main" \
              > /etc/apt/sources.list.d/openkazoo.list

            apt-get update
            apt-get install -y --no-install-recommends kazoo

            # Asserts
            test -x /opt/kazoo/bin/kazoo
            test -f /lib/systemd/system/kazoo.service
            test -f /etc/default/kazoo
            id kazoo >/dev/null
            echo "OK: kazoo installs cleanly on ${{ matrix.suite }}/${{ matrix.arch }}"
          '

  install-rocky-9:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    steps:
      - name: Install from published yum repo
        run: |
          docker run --rm rockylinux:9 bash -e -c '
            set -euxo pipefail
            # rockylinux:9 ships curl-minimal which provides the curl
            # command. Do NOT `dnf install curl` (conflicts with
            # curl-minimal from baseos).

            # No ESL repo needed: ERTS is bundled inside the kazoo package.

            # openkazoo repo. --retry-all-errors waits out 404s when
            # GitHub Pages is still propagating after a fresh publish.
            curl -fsSL --retry 12 --retry-delay 10 --retry-all-errors \
              https://cloudpbx.github.io/openkazoo-kazoo5-builder/el/9/openkazoo.repo \
              -o /etc/yum.repos.d/openkazoo.repo
            rpm --import https://cloudpbx.github.io/openkazoo-kazoo5-builder/pubkey.asc

            dnf install -y kazoo

            # Asserts
            test -x /opt/kazoo/bin/kazoo
            test -f /lib/systemd/system/kazoo.service || test -f /usr/lib/systemd/system/kazoo.service
            test -f /etc/default/kazoo
            id kazoo >/dev/null
            echo "OK: kazoo installs cleanly on Rocky 9"
          '

  # ----- Phase-1 boot test: does the BEAM VM actually run? -----
  # The install-* jobs above only assert files exist. These jobs install
  # kazoo, write a minimal /etc/kazoo/config.ini (just the cookie — no
  # CouchDB/RabbitMQ sidecars in Phase 1), then start `kazoo foreground`
  # and assert the BEAM VM stays up for 30s. Catches package-level
  # runtime defects (missing libs, malformed sys.config, broken bin
  # script, etc.) that file-placement tests miss.

  boot-test-debian:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    name: boot-test-debian (${{ matrix.suite }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runs_on }}
    needs: install-debian
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: bookworm, image: 'debian:12-slim', arch: amd64, runs_on: ubuntu-latest }
          - { suite: bookworm, image: 'debian:12-slim', arch: arm64, runs_on: ubuntu-24.04-arm }
          - { suite: bullseye, image: 'debian:11-slim', arch: amd64, runs_on: ubuntu-latest }
          - { suite: bullseye, image: 'debian:11-slim', arch: arm64, runs_on: ubuntu-24.04-arm }
    steps:
      - name: Boot kazoo and verify BEAM stays up
        run: |
          docker run --rm ${{ matrix.image }} bash -e -c '
            set -euxo pipefail
            apt-get update
            apt-get install -y --no-install-recommends \
              ca-certificates curl gnupg procps

            curl -fsSL --retry 12 --retry-delay 10 --retry-all-errors \
              https://cloudpbx.github.io/openkazoo-kazoo5-builder/pubkey.asc \
              -o /usr/share/keyrings/openkazoo.asc
            echo "deb [signed-by=/usr/share/keyrings/openkazoo.asc] \
              https://cloudpbx.github.io/openkazoo-kazoo5-builder/debian ${{ matrix.suite }} main" \
              > /etc/apt/sources.list.d/openkazoo.list
            apt-get update
            apt-get install -y --no-install-recommends kazoo

            # Minimal runtime config (kazoo5 expects /etc/kazoo/config.ini).
            # No CouchDB/RabbitMQ here — kazoo apps will retry connections
            # forever but the OTP supervision tree should keep the BEAM up.
            mkdir -p /etc/kazoo
            cat > /etc/kazoo/config.ini <<EOF
          [amqp]
          uri = "amqp://guest:guest@127.0.0.1:5672"
          pool_size = 10

          [kazoo_apps]
          cookie = boot-test-cookie

          [log]
          console=info
          error=error

          [data]
          config = couchdb3

          [couchdb3]
          ip = "127.0.0.1"
          port = 5984
          username = admin
          password = admin
          EOF
            chown -R kazoo:kazoo /var/lib/kazoo /var/log/kazoo /etc/kazoo

            # Run kazoo as the kazoo user, capture stdout to a log file.
            # Launch exactly as the systemd unit does: source /etc/kazoo.cookie
            # (the auto-generated KAZOO_COOKIE) then /etc/default/kazoo (KAZOO_NODE,
            # a valid long node name) so both reach the relx runner. Without
            # KAZOO_NODE the node is kazoo_apps@<short-hostname>, which -name
            # rejects -> net_kernel nodistribution -> the BEAM aborts.
            # Redirect inside the kazoo-user shell so it survives the user switch.
            printf "%s\n" "set -a" ". /etc/kazoo.cookie" ". /etc/default/kazoo" "set +a" \
              "cd /var/lib/kazoo" "exec /opt/kazoo/bin/kazoo foreground" > /tmp/launch-kazoo.sh
            chmod 755 /tmp/launch-kazoo.sh
            nohup runuser -u kazoo -- bash /tmp/launch-kazoo.sh > /tmp/kazoo.out 2>&1 &
            KZ_SHELL_PID=$!
            echo "started kazoo (shell pid=$KZ_SHELL_PID)"

            # Wait up to 30s for the BEAM VM to appear
            for i in $(seq 1 30); do
              if pgrep -f "beam.smp.* -- -root /opt/kazoo" >/dev/null 2>&1 \
                 || pgrep -f beam.smp >/dev/null 2>&1; then
                echo "BEAM up after ${i}s"
                break
              fi
              sleep 1
            done

            if ! pgrep -f beam.smp >/dev/null 2>&1; then
              echo "FAIL: BEAM never started"
              echo "--- /tmp/kazoo.out ---"
              cat /tmp/kazoo.out
              exit 1
            fi

            # Hold for 30 more seconds; if the VM crashes in that window
            # (e.g. malformed sys.config, missing app, dep mismatch),
            # this catches it.
            echo "holding 30s to ensure BEAM stays up..."
            sleep 30

            if ! pgrep -f beam.smp >/dev/null 2>&1; then
              echo "FAIL: BEAM crashed within 30s of startup"
              echo "--- /tmp/kazoo.out ---"
              tail -100 /tmp/kazoo.out
              exit 1
            fi

            echo "OK: BEAM VM still running 30s after start"
            echo "--- log tail (informational) ---"
            tail -40 /tmp/kazoo.out || true

            # Clean shutdown
            pkill -TERM -f beam.smp 2>/dev/null || true
            sleep 5
          '

  boot-test-rocky-9:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    needs: install-rocky-9
    steps:
      - name: Boot kazoo and verify BEAM stays up
        run: |
          docker run --rm rockylinux:9 bash -e -c '
            set -euxo pipefail
            curl -fsSL --retry 12 --retry-delay 10 --retry-all-errors \
              https://cloudpbx.github.io/openkazoo-kazoo5-builder/el/9/openkazoo.repo \
              -o /etc/yum.repos.d/openkazoo.repo
            rpm --import https://cloudpbx.github.io/openkazoo-kazoo5-builder/pubkey.asc
            dnf install -y kazoo procps-ng

            mkdir -p /etc/kazoo
            cat > /etc/kazoo/config.ini <<EOF
          [amqp]
          uri = "amqp://guest:guest@127.0.0.1:5672"
          pool_size = 10

          [kazoo_apps]
          cookie = boot-test-cookie

          [log]
          console=info
          error=error

          [data]
          config = couchdb3

          [couchdb3]
          ip = "127.0.0.1"
          port = 5984
          username = admin
          password = admin
          EOF
            chown -R kazoo:kazoo /var/lib/kazoo /var/log/kazoo /etc/kazoo

            # Launch exactly as the systemd unit does: source /etc/kazoo.cookie
            # (auto-generated KAZOO_COOKIE) then /etc/default/kazoo (KAZOO_NODE, a
            # valid long node name) so both reach the relx runner. Without
            # KAZOO_NODE the node is kazoo_apps@<short-hostname>, which -name
            # rejects -> net_kernel nodistribution -> BEAM aborts.
            # Redirect inside the kazoo-user shell so it survives the user switch.
            printf "%s\n" "set -a" ". /etc/kazoo.cookie" ". /etc/default/kazoo" "set +a" \
              "cd /var/lib/kazoo" "exec /opt/kazoo/bin/kazoo foreground" > /tmp/launch-kazoo.sh
            chmod 755 /tmp/launch-kazoo.sh
            nohup runuser -u kazoo -- bash /tmp/launch-kazoo.sh > /tmp/kazoo.out 2>&1 &
            echo "started kazoo"

            for i in $(seq 1 30); do
              if pgrep -f beam.smp >/dev/null 2>&1; then
                echo "BEAM up after ${i}s"
                break
              fi
              sleep 1
            done

            if ! pgrep -f beam.smp >/dev/null 2>&1; then
              echo "FAIL: BEAM never started"
              cat /tmp/kazoo.out
              exit 1
            fi

            echo "holding 30s to ensure BEAM stays up..."
            sleep 30

            if ! pgrep -f beam.smp >/dev/null 2>&1; then
              echo "FAIL: BEAM crashed within 30s of startup"
              tail -100 /tmp/kazoo.out
              exit 1
            fi

            echo "OK: BEAM VM still running 30s after start"
            tail -40 /tmp/kazoo.out || true
            pkill -TERM -f beam.smp 2>/dev/null || true
            sleep 5
          '

  # ----- Phase-2 boot test: does kazoo connect to its dependencies? -----
  # Phase 1 proved BEAM stays up without CouchDB/RabbitMQ.
  # Phase 2 stands up real CouchDB + RabbitMQ sidecars, points kazoo at
  # them, and checks for evidence that kazoo's apps actually established
  # connections — via `sup kapps_controller running_apps` (RPC into
  # the live BEAM) and log inspection.
  #
  # Debian-only initially. If this passes, mirroring to Rocky 9 is
  # straightforward (the kazoo Erlang behavior is distro-independent
  # once BEAM is running).
  boot-test-phase2-debian-12:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    needs: boot-test-debian
    steps:
      - name: Stand up sidecars and verify kazoo connects
        run: |
          set -euxo pipefail
          NET="kazoo-test-${{ github.run_id }}"
          docker network create "$NET"

          # CouchDB 3.x — kazoo5/rel/ci.config.ini's [couchdb3] driver expects this.
          docker run -d \
            --name "couchdb-${{ github.run_id }}" \
            --network "$NET" --network-alias couchdb \
            -e COUCHDB_USER=admin -e COUCHDB_PASSWORD=admin \
            apache/couchdb:3.3

          # RabbitMQ. The default `guest` account is restricted to
          # localhost; create an explicit kazoo:kazoo user via env vars.
          docker run -d \
            --name "rabbitmq-${{ github.run_id }}" \
            --network "$NET" --network-alias rabbitmq \
            -e RABBITMQ_DEFAULT_USER=kazoo \
            -e RABBITMQ_DEFAULT_PASS=kazoo \
            rabbitmq:3.12

          # Wait for both sidecars
          echo "waiting for CouchDB..."
          for i in $(seq 1 60); do
            if docker exec "couchdb-${{ github.run_id }}" curl -sf http://admin:admin@localhost:5984/ >/dev/null 2>&1; then
              echo "CouchDB up after ${i}s"; break
            fi; sleep 2
          done
          docker exec "couchdb-${{ github.run_id }}" curl -sf http://admin:admin@localhost:5984/ \
            || { echo "FAIL: CouchDB not ready"; exit 1; }

          # Bootstrap the three system databases kazoo expects.
          for db in _users _replicator _global_changes; do
            docker exec "couchdb-${{ github.run_id }}" \
              curl -sf -u admin:admin -X PUT "http://localhost:5984/$db" || true
          done

          echo "waiting for RabbitMQ..."
          for i in $(seq 1 60); do
            if docker exec "rabbitmq-${{ github.run_id }}" rabbitmq-diagnostics -q ping >/dev/null 2>&1; then
              echo "RabbitMQ up after ${i}s"; break
            fi; sleep 2
          done

          # Run kazoo on the same network, pointing config at the sidecar hostnames.
          docker run --rm \
            --name "kazoo-${{ github.run_id }}" \
            --network "$NET" \
            debian:12-slim bash -e -c '
              set -euxo pipefail
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates curl gnupg procps

              curl -fsSL --retry 12 --retry-delay 10 --retry-all-errors \
                https://cloudpbx.github.io/openkazoo-kazoo5-builder/pubkey.asc \
                -o /usr/share/keyrings/openkazoo.asc
              echo "deb [signed-by=/usr/share/keyrings/openkazoo.asc] \
                https://cloudpbx.github.io/openkazoo-kazoo5-builder/debian bookworm main" \
                > /etc/apt/sources.list.d/openkazoo.list
              apt-get update
              apt-get install -y --no-install-recommends kazoo

              # Point config at sidecar hostnames (docker network DNS resolves these).
              mkdir -p /etc/kazoo
              cat > /etc/kazoo/config.ini <<EOF
          [amqp]
          uri = "amqp://kazoo:kazoo@rabbitmq:5672"
          pool_size = 10

          [kazoo_apps]
          cookie = phase2-cookie

          [log]
          console=info
          error=error

          [data]
          config = couchdb3

          [couchdb3]
          ip = "couchdb"
          port = 5984
          username = admin
          password = admin
          EOF
              chown -R kazoo:kazoo /var/lib/kazoo /var/log/kazoo /etc/kazoo

              # Launch as systemd does: source /etc/kazoo.cookie (auto-generated
              # KAZOO_COOKIE) then /etc/default/kazoo (KAZOO_NODE) so both reach
              # the relx runner (see phase-1 note).
              # Redirect inside the kazoo-user shell so it survives the user switch.
              printf "%s\n" "set -a" ". /etc/kazoo.cookie" ". /etc/default/kazoo" "set +a" \
                "cd /var/lib/kazoo" "exec /opt/kazoo/bin/kazoo foreground" > /tmp/launch-kazoo.sh
              chmod 755 /tmp/launch-kazoo.sh
              nohup runuser -u kazoo -- bash /tmp/launch-kazoo.sh > /tmp/kazoo.out 2>&1 &

              for i in $(seq 1 30); do
                if pgrep -f beam.smp >/dev/null 2>&1; then
                  echo "BEAM up after ${i}s"; break
                fi; sleep 1
              done
              pgrep -f beam.smp >/dev/null 2>&1 || { echo "FAIL: BEAM never started"; cat /tmp/kazoo.out; exit 1; }

              # Give kazoo apps time to connect to CouchDB + RabbitMQ.
              echo "holding 90s for kazoo to connect to sidecars..."
              sleep 90

              pgrep -f beam.smp >/dev/null 2>&1 || { echo "FAIL: BEAM crashed"; tail -200 /tmp/kazoo.out; exit 1; }

              # Hard proof of life: sup RPCs into the running BEAM.
              echo "--- sup kapps_controller running_apps ---"
              if runuser -u kazoo -- /opt/kazoo/bin/sup kapps_controller running_apps 2>&1; then
                echo "OK: sup RPC succeeded"
              else
                echo "WARN: sup RPC failed (kazoo may not be fully bootstrapped)"
              fi

              echo "--- last 60 lines of kazoo.out ---"
              tail -60 /tmp/kazoo.out

              # Look for explicit success markers in the log.
              if grep -iE "amqp.*connect|connected.*amqp" /tmp/kazoo.out >/dev/null; then
                echo "OK: AMQP connection log present"
              else
                echo "WARN: no AMQP connection log line found"
              fi
              if grep -iE "couch.*connect|connected.*couch|opened.*db" /tmp/kazoo.out >/dev/null; then
                echo "OK: CouchDB connection log present"
              else
                echo "WARN: no CouchDB connection log line found"
              fi

              pkill -TERM -f beam.smp 2>/dev/null || true
              sleep 5
              echo "OK: phase-2 boot test complete"
            '

      - name: Cleanup
        if: always()
        run: |
          docker stop "couchdb-${{ github.run_id }}" "rabbitmq-${{ github.run_id }}" 2>/dev/null || true
          docker rm   "couchdb-${{ github.run_id }}" "rabbitmq-${{ github.run_id }}" 2>/dev/null || true
          docker network rm "kazoo-test-${{ github.run_id }}" 2>/dev/null || true
